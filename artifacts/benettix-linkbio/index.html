    <style>
      :root {
        color-scheme: dark;
        --bg: #0d0520;
        --bg2: #1a0a2e;
        --card: rgba(20, 10, 36, 0.72);
        --border: rgba(255, 255, 255, 0.08);
        --text: #f8f0ff;
        --muted: rgba(220, 180, 255, 0.72);
        --muted-soft: rgba(180, 130, 220, 0.42);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        font-family: "Inter", sans-serif;
        background: linear-gradient(160deg, var(--bg) 0%, #13081f 40%, var(--bg) 100%);
        color: var(--text);
      }

      body {
        min-height: 100vh;
      }

      a {
        color: inherit;
      }

      .app {
        position: relative;
        min-height: 100vh;
        overflow: hidden;
        display: grid;
        place-items: start center;
        padding: 3rem 1rem;
      }

      .orb {
        position: absolute;
        border-radius: 999px;
        filter: blur(80px);
        opacity: 0.34;
        pointer-events: none;
      }

      .card {
        position: relative;
        z-index: 1;
        width: min(100%, 420px);
        padding: 1.5rem;
        border: 1px solid var(--border);
        border-radius: 28px;
        background: var(--card);
        backdrop-filter: blur(14px);
        box-shadow: 0 20px 80px rgba(0, 0, 0, 0.35);
      }

      .brand {
        display: grid;
        justify-items: center;
        gap: 0.75rem;
      }

      .avatar-ring {
        width: 146px;
        height: 146px;
        border-radius: 50%;
        padding: 3px;
        background: conic-gradient(from 0deg, #e91e8c, #a855f7, #5b2da8, #e91e8c);
        box-shadow: 0 0 20px rgba(233, 30, 140, 0.35), 0 0 60px rgba(91, 45, 168, 0.25);
        animation: spin 12s linear infinite;
      }

      .avatar {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        overflow: hidden;
        border: 2px solid rgba(255, 255, 255, 0.08);
        background: linear-gradient(135deg, #1a0a2e, #2d0f4e);
      }

      .avatar img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        display: block;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 2.5rem);
        line-height: 1;
        letter-spacing: -0.05em;
        background: linear-gradient(90deg, #e91e8c, #a855f7, #e91e8c);
        background-size: 200% auto;
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        animation: shimmer 4s linear infinite;
      }

      .tagline {
        margin: 0;
        color: var(--muted);
        text-align: center;
        font-size: 0.95rem;
      }

      .divider {
        width: 64px;
        height: 1px;
        margin: 1.5rem auto;
        background: linear-gradient(90deg, transparent, #e91e8c, transparent);
      }

      .links {
        display: grid;
        gap: 0.875rem;
      }

      .link {
        position: relative;
        display: flex;
        align-items: center;
        gap: 1rem;
        padding: 1rem 1.1rem;
        border-radius: 20px;
        text-decoration: none;
        color: white;
        overflow: hidden;
        transform: translateY(0);
        transition: transform 180ms ease, box-shadow 180ms ease;
      }

      .link:hover {
        transform: translateY(-2px);
      }

      .link::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(255, 255, 255, 0.08);
        opacity: 0;
        transition: opacity 180ms ease;
      }

      .link:hover::before {
        opacity: 1;
      }

      .icon {
        width: 44px;
        height: 44px;
        display: grid;
        place-items: center;
        border-radius: 14px;
        background: rgba(0, 0, 0, 0.24);
        flex: 0 0 auto;
      }

      .text {
        min-width: 0;
      }

      .title {
        display: block;
        font-weight: 700;
        line-height: 1.1;
      }

      .sub {
        display: block;
        margin-top: 0.15rem;
        font-size: 0.82rem;
        opacity: 0.88;
      }

      .arrow {
        margin-left: auto;
        opacity: 0.7;
        flex: 0 0 auto;
      }

      .footer {
        margin-top: 1.5rem;
        text-align: center;
        font-size: 0.8rem;
        color: var(--muted-soft);
      }

      .fade {
        animation: fadeUp 700ms ease both;
      }

      @keyframes shimmer {
        from { background-position: 0% center; }
        to { background-position: 200% center; }
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(18px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }

      @media (max-width: 480px) {
        .app {
          padding-top: 2rem;
        }

        .card {
          padding: 1.15rem;
          border-radius: 24px;
        }

        .link {
          padding: 0.95rem 0.95rem;
        }
      }
    </style>
